<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1700" viewBox="0 0 1800 1700" role="img" aria-labelledby="title description">
  <title id="title">Wireframe dua jalur reservasi N-Space</title>
  <desc id="description">Satu halaman awal menawarkan Study Space atau venue luar. Wireframe memperlihatkan empat langkah khusus untuk masing-masing jenis reservasi.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #1f2a37; }
      .display { font-family: "Bricolage Grotesque", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #64748b; }
      .primary { fill: #115e59; }
      .venue { fill: #9a4f18; }
      .line { stroke: #dbe3e8; }
      .panel { fill: #ffffff; stroke: #dbe3e8; }
      .field { fill: #ffffff; stroke: #cbd5dc; }
      .tiny { font-size: 11px; }
      .small { font-size: 13px; }
      .body { font-size: 14px; }
      .label { font-size: 12px; font-weight: 600; }
      .heading { font-size: 17px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1800" height="1700" fill="#f3f6f7"/>
  <rect x="70" y="58" width="6" height="78" rx="3" fill="#115e59"/>
  <text x="96" y="76" class="small primary" font-weight="700" letter-spacing="1.5">WIREFRAME · PILIH JENIS RESERVASI</text>
  <text x="96" y="119" class="display" font-size="34" font-weight="700">Satu pintu masuk, formulir sesuai kebutuhan</text>
  <text x="96" y="153" class="body muted">Pengguna memilih layanan terlebih dahulu. Data acara dan alur penawaran hanya muncul untuk venue luar.</text>
  <rect x="1530" y="72" width="200" height="34" rx="17" fill="#e1eeec"/>
  <circle cx="1550" cy="89" r="5" fill="#115e59"/>
  <text x="1563" y="94" class="small primary" font-weight="600">Rancangan awal</text>

  <!-- Shared entry point -->
  <rect x="70" y="184" width="1660" height="138" rx="14" class="panel"/>
  <text x="94" y="216" class="tiny muted" font-weight="700">LANGKAH AWAL · PILIH KEBUTUHAN</text>
  <rect x="94" y="232" width="785" height="70" rx="10" fill="#f5faf9" stroke="#115e59" stroke-width="1.5"/>
  <circle cx="120" cy="267" r="9" fill="#115e59"/>
  <text x="143" y="261" class="heading">Pesan Study Space</text>
  <text x="143" y="283" class="tiny muted">Day pass, tarif, snack/minuman, pembayaran langsung.</text>
  <rect x="921" y="232" width="785" height="70" rx="10" fill="#fffaf5" stroke="#d7a646" stroke-width="1.5"/>
  <circle cx="947" cy="267" r="9" fill="#ffffff" stroke="#9a4f18" stroke-width="1.5"/>
  <text x="970" y="261" class="heading">Pesan venue luar</text>
  <text x="970" y="283" class="tiny muted">Venue, tanggal acara, kapasitas, fasilitas, dan konfirmasi admin.</text>

  <!-- Path headings -->
  <rect x="70" y="344" width="800" height="34" rx="8" fill="#e1eeec"/>
  <text x="88" y="366" class="small primary" font-weight="700">JALUR A · STUDY SPACE (ALUR LAMA DIPERTAHANKAN)</text>
  <rect x="930" y="344" width="800" height="34" rx="8" fill="#fff1e6"/>
  <text x="948" y="366" class="small venue" font-weight="700">JALUR B · VENUE LUAR (FORMULIR PENGAJUAN)</text>

  <!-- Row 1: service selection and venue selection -->
  <g>
    <rect x="70" y="392" width="800" height="260" rx="14" class="panel"/>
    <circle cx="98" cy="420" r="14" fill="#115e59"/>
    <text x="98" y="425" text-anchor="middle" class="tiny" fill="#ffffff" font-weight="700">1</text>
    <text x="122" y="426" class="heading">Pilih tarif</text>
    <text x="846" y="424" text-anchor="end" class="tiny muted">STUDY SPACE</text>
    <line x1="88" y1="444" x2="852" y2="444" class="line"/>
    <text x="94" y="473" class="label">Tarif yang berlaku untuk seluruh area</text>
    <rect x="94" y="489" width="350" height="54" rx="8" fill="#f5faf9" stroke="#115e59"/>
    <circle cx="114" cy="516" r="7" fill="#115e59"/>
    <text x="134" y="521" class="small" font-weight="600">Mahasiswa · Rp35.000 / hari</text>
    <rect x="94" y="555" width="350" height="54" rx="8" class="field"/>
    <circle cx="114" cy="582" r="7" fill="#ffffff" stroke="#aab7bf"/>
    <text x="134" y="587" class="small">Umum · Rp55.000 / hari</text>
    <rect x="476" y="480" width="354" height="135" rx="10" fill="#fbfcfc" stroke="#dbe3e8"/>
    <text x="496" y="510" class="tiny muted" font-weight="700">INFORMASI LAYANAN</text>
    <text x="496" y="540" class="small" font-weight="600">Area belajar open-space</text>
    <text x="496" y="562" class="tiny muted">Kapasitas dan fasilitas umum ditampilkan.</text>
    <text x="496" y="588" class="tiny primary" font-weight="600">Tidak memilih ruang atau nomor meja.</text>
    <text x="94" y="632" class="tiny muted">Khusus mahasiswa, unggah KTM pada langkah data pemesan.</text>
  </g>

  <g>
    <rect x="930" y="392" width="800" height="260" rx="14" class="panel"/>
    <circle cx="958" cy="420" r="14" fill="#9a4f18"/>
    <text x="958" y="425" text-anchor="middle" class="tiny" fill="#ffffff" font-weight="700">1</text>
    <text x="982" y="426" class="heading">Pilih venue dari katalog</text>
    <text x="1706" y="424" text-anchor="end" class="tiny muted">VENUE LUAR</text>
    <line x1="948" y1="444" x2="1712" y2="444" class="line"/>
    <text x="954" y="473" class="label">Pilih venue yang dikelola admin</text>
    <rect x="954" y="489" width="474" height="74" rx="8" fill="#fffaf5" stroke="#9a4f18" stroke-width="1.5"/>
    <circle cx="974" cy="526" r="7" fill="#9a4f18"/>
    <text x="994" y="519" class="small" font-weight="700">Danuraga</text>
    <text x="994" y="541" class="tiny muted">Kapasitas dan alamat venue ditampilkan di sini.</text>
    <rect x="954" y="575" width="474" height="45" rx="8" class="field"/>
    <text x="972" y="603" class="small muted">Cari atau pilih venue lain</text>
    <rect x="1450" y="480" width="258" height="140" rx="10" fill="#fbfcfc" stroke="#dbe3e8"/>
    <text x="1468" y="510" class="tiny muted" font-weight="700">RINGKASAN VENUE</text>
    <text x="1468" y="538" class="small" font-weight="600">Danuraga</text>
    <text x="1468" y="560" class="tiny muted">Alamat · kapasitas</text>
    <text x="1468" y="584" class="tiny muted">Fasilitas tersedia</text>
    <text x="1468" y="606" class="tiny venue">Harga final dikonfirmasi admin.</text>
  </g>

  <!-- Row 2: schedule -->
  <g>
    <rect x="70" y="682" width="800" height="260" rx="14" class="panel"/>
    <circle cx="98" cy="710" r="14" fill="#115e59"/>
    <text x="98" y="715" text-anchor="middle" class="tiny" fill="#ffffff" font-weight="700">2</text>
    <text x="122" y="716" class="heading">Tentukan tanggal dan jam</text>
    <text x="846" y="714" text-anchor="end" class="tiny muted">STUDY SPACE</text>
    <line x1="88" y1="734" x2="852" y2="734" class="line"/>
    <text x="94" y="763" class="label">Tanggal mulai</text>
    <rect x="94" y="775" width="340" height="76" rx="8" class="field"/>
    <text x="112" y="806" class="small">Pilih tanggal di kalender</text>
    <text x="112" y="830" class="tiny muted">Tanggal penuh atau tutup tidak bisa dipilih.</text>
    <text x="466" y="763" class="label">Jam kedatangan · kepulangan</text>
    <rect x="466" y="775" width="162" height="44" rx="8" class="field"/>
    <text x="482" y="803" class="small">10.00</text>
    <rect x="644" y="775" width="188" height="44" rx="8" class="field"/>
    <text x="660" y="803" class="small">18.00</text>
    <text x="466" y="850" class="label">Durasi</text>
    <rect x="466" y="861" width="366" height="44" rx="8" class="field"/>
    <text x="484" y="889" class="small">−</text>
    <text x="648" y="889" text-anchor="middle" class="small" font-weight="700">2 hari</text>
    <text x="812" y="889" text-anchor="end" class="small">+</text>
    <text x="94" y="916" class="tiny muted">Ringkasan menampilkan tanggal awal–akhir dan total biaya.</text>
  </g>

  <g>
    <rect x="930" y="682" width="800" height="260" rx="14" class="panel"/>
    <circle cx="958" cy="710" r="14" fill="#9a4f18"/>
    <text x="958" y="715" text-anchor="middle" class="tiny" fill="#ffffff" font-weight="700">2</text>
    <text x="982" y="716" class="heading">Atur tanggal dan jam acara</text>
    <text x="1706" y="714" text-anchor="end" class="tiny muted">VENUE LUAR</text>
    <line x1="948" y1="734" x2="1712" y2="734" class="line"/>
    <text x="954" y="763" class="label">Tanggal acara · setiap tanggal memiliki jam</text>
    <rect x="954" y="775" width="754" height="48" rx="8" fill="#fbfcfc" stroke="#dbe3e8"/>
    <text x="972" y="805" class="small">31 Okt [tahun]</text>
    <text x="1192" y="805" class="small">10.00</text>
    <text x="1308" y="805" class="tiny muted">sampai</text>
    <text x="1386" y="805" class="small">18.00</text>
    <text x="1688" y="805" text-anchor="end" class="tiny venue">Hapus</text>
    <rect x="954" y="831" width="754" height="48" rx="8" fill="#fbfcfc" stroke="#dbe3e8"/>
    <text x="972" y="861" class="small">1 Nov [tahun]</text>
    <text x="1192" y="861" class="small">10.00</text>
    <text x="1308" y="861" class="tiny muted">sampai</text>
    <text x="1386" y="861" class="small">18.00</text>
    <text x="1688" y="861" text-anchor="end" class="tiny venue">Hapus</text>
    <text x="954" y="910" class="tiny venue" font-weight="600">+ Tambah tanggal</text>
    <text x="1140" y="910" class="tiny muted">Tahun wajib dipilih; tanggal dapat berurutan atau terpisah.</text>
  </g>

  <!-- Row 3: extras and event -->
  <g>
    <rect x="70" y="972" width="800" height="260" rx="14" class="panel"/>
    <circle cx="98" cy="1000" r="14" fill="#115e59"/>
    <text x="98" y="1005" text-anchor="middle" class="tiny" fill="#ffffff" font-weight="700">3</text>
    <text x="122" y="1006" class="heading">Tambahan snack atau minuman</text>
    <text x="846" y="1004" text-anchor="end" class="tiny muted">OPSIONAL · STUDY SPACE</text>
    <line x1="88" y1="1024" x2="852" y2="1024" class="line"/>
    <text x="94" y="1053" class="tiny muted">Boleh dilewati. Harga ditampilkan sebelum lanjut.</text>
    <rect x="94" y="1065" width="738" height="50" rx="8" class="field"/>
    <text x="114" y="1096" class="small">☐ Kopi / minuman</text>
    <text x="810" y="1096" text-anchor="end" class="tiny muted">Harga per item</text>
    <rect x="94" y="1123" width="738" height="50" rx="8" class="field"/>
    <text x="114" y="1154" class="small">☐ Snack</text>
    <text x="810" y="1154" text-anchor="end" class="tiny muted">Harga per item</text>
    <text x="94" y="1206" class="tiny muted">Fasilitas venue luar tidak dicampur ke daftar snack ini.</text>
  </g>

  <g>
    <rect x="930" y="972" width="800" height="260" rx="14" class="panel"/>
    <circle cx="958" cy="1000" r="14" fill="#9a4f18"/>
    <text x="958" y="1005" text-anchor="middle" class="tiny" fill="#ffffff" font-weight="700">3</text>
    <text x="982" y="1006" class="heading">Isi detail kegiatan dan fasilitas</text>
    <text x="1706" y="1004" text-anchor="end" class="tiny muted">VENUE LUAR</text>
    <line x1="948" y1="1024" x2="1712" y2="1024" class="line"/>
    <text x="954" y="1053" class="label">Instansi</text>
    <rect x="954" y="1063" width="350" height="40" rx="7" class="field"/>
    <text x="970" y="1089" class="small muted">Nama instansi</text>
    <text x="1324" y="1053" class="label">Jenis kegiatan</text>
    <rect x="1324" y="1063" width="384" height="40" rx="7" class="field"/>
    <text x="1340" y="1089" class="small muted">Pilih atau isi jenis acara</text>
    <text x="954" y="1132" class="label">Jumlah peserta</text>
    <rect x="954" y="1142" width="170" height="40" rx="7" class="field"/>
    <text x="970" y="1168" class="small muted">6 orang</text>
    <text x="1144" y="1132" class="label">Fasilitas tambahan (opsional)</text>
    <rect x="1144" y="1142" width="564" height="40" rx="7" class="field"/>
    <text x="1160" y="1168" class="small">☐ Pilih dari fasilitas venue · atau Tidak ada</text>
    <text x="954" y="1206" class="tiny muted">Kapasitas maksimal venue ditampilkan dan jumlah peserta divalidasi.</text>
  </g>

  <!-- Row 4: contact and submission -->
  <g>
    <rect x="70" y="1262" width="800" height="260" rx="14" class="panel"/>
    <circle cx="98" cy="1290" r="14" fill="#115e59"/>
    <text x="98" y="1295" text-anchor="middle" class="tiny" fill="#ffffff" font-weight="700">4</text>
    <text x="122" y="1296" class="heading">Data pemesan dan pembayaran</text>
    <text x="846" y="1294" text-anchor="end" class="tiny muted">STUDY SPACE</text>
    <line x1="88" y1="1314" x2="852" y2="1314" class="line"/>
    <text x="94" y="1343" class="label">Nama lengkap</text>
    <rect x="94" y="1353" width="350" height="40" rx="7" class="field"/>
    <text x="110" y="1379" class="small muted">Nama sesuai identitas</text>
    <text x="466" y="1343" class="label">Nomor WhatsApp</text>
    <rect x="466" y="1353" width="366" height="40" rx="7" class="field"/>
    <text x="482" y="1379" class="small muted">08xxxxxxxxxx</text>
    <rect x="94" y="1410" width="450" height="62" rx="8" fill="#fbfcfc" stroke="#dbe3e8"/>
    <text x="112" y="1437" class="tiny muted" font-weight="700">RINGKASAN BIAYA</text>
    <text x="112" y="1458" class="small">Tarif + snack/minuman · total</text>
    <rect x="654" y="1424" width="178" height="38" rx="8" fill="#115e59"/>
    <text x="743" y="1448" text-anchor="middle" class="tiny" fill="#ffffff" font-weight="700">Bayar sekarang →</text>
    <text x="94" y="1501" class="tiny muted">Alur pembayaran Study Space tetap otomatis seperti sekarang.</text>
  </g>

  <g>
    <rect x="930" y="1262" width="800" height="260" rx="14" class="panel"/>
    <circle cx="958" cy="1290" r="14" fill="#9a4f18"/>
    <text x="958" y="1295" text-anchor="middle" class="tiny" fill="#ffffff" font-weight="700">4</text>
    <text x="982" y="1296" class="heading">Kontak dan kirim pengajuan</text>
    <text x="1706" y="1294" text-anchor="end" class="tiny muted">VENUE LUAR</text>
    <line x1="948" y1="1314" x2="1712" y2="1314" class="line"/>
    <text x="954" y="1343" class="label">Nama pemesan</text>
    <rect x="954" y="1353" width="350" height="40" rx="7" class="field"/>
    <text x="970" y="1379" class="small muted">Nama lengkap</text>
    <text x="1324" y="1343" class="label">Nomor WhatsApp</text>
    <rect x="1324" y="1353" width="384" height="40" rx="7" class="field"/>
    <text x="1340" y="1379" class="small muted">08xxxxxxxxxx</text>
    <rect x="954" y="1410" width="474" height="74" rx="8" fill="#fbfcfc" stroke="#dbe3e8"/>
    <text x="972" y="1436" class="tiny muted" font-weight="700">RINGKASAN PENGAJUAN</text>
    <text x="972" y="1458" class="tiny">Venue · tanggal/jam · acara · pax · fasilitas</text>
    <text x="972" y="1476" class="tiny venue" font-weight="600">Harga dan ketersediaan menunggu admin.</text>
    <rect x="1512" y="1425" width="196" height="42" rx="8" fill="#9a4f18"/>
    <text x="1610" y="1452" text-anchor="middle" class="tiny" fill="#ffffff" font-weight="700">Ajukan reservasi →</text>
    <text x="954" y="1505" class="tiny muted">Setelah dikirim: status “Menunggu tinjauan admin” · belum ada pembayaran.</text>
  </g>

  <rect x="70" y="1550" width="1660" height="84" rx="12" fill="#ffffff" stroke="#dbe3e8"/>
  <text x="94" y="1579" class="small" font-weight="700">Catatan rancangan</text>
  <text x="94" y="1603" class="small muted">Tanggal acara perlu mencantumkan tahun dan dapat ditambah satu per satu. Contoh 31 Oktober &amp; 1 November perlu tahun yang valid; per 4 November 2026, tanggal Oktober/November 2026 tersebut sudah lewat.</text>
  <text x="94" y="1622" class="tiny muted">Ilustrasi venue/fasilitas adalah contoh wireframe; daftar, harga, aturan, dan kapasitas harus mengikuti katalog admin yang sebenarnya.</text>
</svg>
